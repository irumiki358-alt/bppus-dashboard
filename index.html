<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="true">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BPPUS Dashboard">
    <meta name="theme-color" content="#667eea">
    <title>BPPUS Operations Dashboard</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;overflow:hidden}
        body{display:flex;flex-direction:column}
        header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
        h1{font-size:16px;margin:0}
        button{background:rgba(255,255,255,.2);border:none;color:white;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
        button:active{background:rgba(255,255,255,.3)}
        .content{flex:1;overflow:hidden;display:flex;flex-direction:column}
        iframe{width:100%;height:100%;border:none}
        .spinner{border:4px solid #f0f0f0;border-top:4px solid #667eea;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .message{text-align:center;padding:20px;color:#666}
    </style>
</head>
<body>
    <header>
        <h1>🔵 BPPUS Dashboard</h1>
        <button onclick="location.reload()">🔄</button>
    </header>
    <div class="content">
        <div id="loading" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;flex:1">
            <div class="spinner"></div>
            <div class="message">Loading Dashboard...</div>
        </div>
        <iframe id="dashboard" src="./dashboard.html" style="display:none;" title="BPPUS Dashboard"></iframe>iframe>    </div>
    <script>
        document.getElementById('dashboard').onload = function(){
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        };
        setTimeout(function(){
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }, 5000);
        if('serviceWorker' in navigator){
            navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",e=>{})').catch(()=>{});
        }
    </script>
</body>
</html>
